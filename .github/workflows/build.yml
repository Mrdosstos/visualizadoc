name: Build

# Compila em modo debug a cada push na main e em pull requests,
# só para avisar se o build quebrou. O APK fica nos artefatos da execução.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # O pendrive (exFAT) não guarda o bit de execução do gradlew
      - run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VisualizaDoc-debug
          path: app/build/outputs/apk/debug/*.apk
