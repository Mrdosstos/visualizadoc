name: Build

# A cada push na main e em pull requests: roda os testes e compila debug e
# release (o release valida as regras do R8; sem keystore, usa a chave de debug).
# O APK debug fica nos artefatos da execução.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # O pendrive (exFAT) não guarda o bit de execução do gradlew
      - run: chmod +x gradlew

      - name: Testes e build (debug + release)
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: VisualizaDoc-debug
          path: app/build/outputs/apk/debug/*.apk
