name: Build

# A cada push na main e em pull requests: roda os testes e compila o APK debug,
# que fica nos artefatos da execução. O release é compilado no workflow de tags.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # O pendrive (exFAT) não guarda o bit de execução do gradlew
      - run: chmod +x gradlew

      # Uma só chamada ao Gradle: o projeto é configurado e o POI empacotado uma vez.
      - name: Testes e build debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: VisualizaDoc-debug
          path: app/build/outputs/apk/debug/*.apk
