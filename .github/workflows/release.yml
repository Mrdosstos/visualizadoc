name: Release

# Ao criar uma tag v* (ex.: v0.1.0), compila o APK assinado
# e publica uma Release no GitHub com o arquivo anexado.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # O pendrive (exFAT) não guarda o bit de execução do gradlew
      - run: chmod +x gradlew

      - name: Restaurar keystore dos Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não configurado."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease --stacktrace \
            -PversionName="$VERSAO" \
            -PversionCode="${{ github.run_number }}"
          mv app/build/outputs/apk/release/app-release.apk "VisualizaDoc-$VERSAO.apk"

      - name: Publicar Release
        uses: softprops/action-gh-release@v3
        with:
          files: VisualizaDoc-*.apk
          generate_release_notes: true
