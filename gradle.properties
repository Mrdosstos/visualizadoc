org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Reaproveita resultados de tarefas e a configuração do projeto entre builds
# (o cache fica salvo pelo setup-gradle no CI).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# R8 em modo compatível: o "full mode" fica lento demais com a reflexão do POI.
android.enableR8.fullMode=false
